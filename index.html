
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Красива Форма</title>
    <!-- Підключаємо офіційний скрипт Telegram Mini Apps -->
    <script src="https://telegram.org"></script>
    <style>
        body { font-family: sans-serif; background: var(--tg-theme-bg-color, #fff); color: var(--tg-theme-text-color, #000); padding: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: var(--tg-theme-button-color, #248bcf); color: var(--tg-theme-button-text-color, #fff); border: none; border-radius: 8px; font-size: 16px; cursor: pointer; }
    </style>
</head>
<body>

    <h2>Заповніть дані</h2>
    <div class="form-group">
        <label for="name">Ваше ім'я:</label>
        <input type="text" id="name" placeholder="Введіть ім'я">
    </div>
    <div class="form-group">
        <label for="phone">Телефон:</label>
        <input type="tel" id="phone" placeholder="+380...">
    </div>
    <button id="sendData">Надіслати в бот</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready(); // Повідомляємо Telegram, що додаток готовий

        document.getElementById('sendData').addEventListener('click', () => {
            const name = document.getElementById('name').value;
            const phone = document.getElementById('phone').value;

            if(!name || !phone) {
                alert("Будь ласка, заповніть усі поля!");
                return;
            }

            // Збираємо дані в об'єкт
            const data = { name: name, phone: phone };

            // Надсилаємо дані назад у бот у форматі JSON
            tg.sendData(JSON.stringify(data));
            tg.close(); // Закриваємо вікно форми
        });
    </script>
</body>
</html>
